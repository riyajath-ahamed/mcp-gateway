# fly.toml — Fly.io deployment for mcp-gateway
# fly launch --config deploy/fly.toml

app = "mcp-gateway"
primary_region = "sin"  # Singapore — close to Sri Lanka

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 500

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[env]
  PORT = "8080"

[[services.tcp_checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "5s"

[[services.http_checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"
